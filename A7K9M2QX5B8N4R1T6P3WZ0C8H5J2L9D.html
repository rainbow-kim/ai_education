<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 홍보 프롬프트 생성기</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --navy: #0f1f3d;
      --navy2: #1b3263;
      --orange: #ff6b1a;
      --lime: #c6f432;
      --bg: #f4f6fa;
      --line: #dfe4ee;
      --text: #1a2233;
      --sub: #5b6578
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 18px
    }

    header {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      color: #fff;
      padding: 34px 0 64px;
      overflow: hidden;
      position: relative
    }

    header:after {
      content: "";
      position: absolute;
      right: -70px;
      top: -70px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 28px solid rgba(198, 244, 50, .16)
    }

    .badge {
      display: inline-block;
      background: var(--lime);
      color: var(--navy);
      font-weight: 900;
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 99px
    }

    h1 {
      font-family: 'Black Han Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(26px, 5vw, 40px);
      margin: 12px 0 6px
    }

    h1 em {
      font-style: normal;
      color: var(--lime)
    }

    header p {
      margin: 0;
      opacity: .85
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(15, 31, 61, .07);
      margin-bottom: 18px
    }

    .lift {
      margin-top: -44px;
      position: relative;
      z-index: 2
    }

    .title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 900;
      margin: 0 0 12px
    }

    .title .n {
      background: var(--orange);
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      font-size: 14px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .full {
      grid-column: 1/-1
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 4px
    }

    .qhint {
      font-weight: 500;
      color: var(--sub);
      font-size: 12px
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font: inherit;
      font-size: 15px;
      background: #fff;
      color: var(--text)
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--orange)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px
    }

    .chip {
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 99px;
      padding: 6px 13px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      color: var(--text)
    }

    .chip.on {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff
    }

    .qs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      background: #f8fafd;
      border: 1.5px dashed var(--line);
      border-radius: 12px;
      padding: 12px
    }

    .qs label {
      font-size: 12.5px;
      margin: 0 0 3px
    }

    .qs input {
      font-size: 14px;
      padding: 8px 10px
    }

    .qs .wide {
      grid-column: 1/-1
    }

    .brand {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 12px
    }

    .sub {
      background: #f8fafd;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px
    }

    .seg {
      display: flex;
      gap: 6px;
      margin-bottom: 8px
    }

    .seg button {
      flex: 1;
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 9px;
      padding: 7px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text)
    }

    .seg button.on {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy)
    }

    .logoRow {
      display: flex;
      gap: 10px;
      align-items: center
    }

    .logoPrev {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      border: 1.5px dashed var(--line);
      display: grid;
      place-items: center;
      background: #fff;
      overflow: hidden;
      flex: none;
      font-size: 11px;
      color: var(--sub);
      text-align: center
    }

    .logoPrev img {
      max-width: 100%;
      max-height: 100%
    }

    .upl {
      display: inline-block;
      background: var(--orange);
      color: #fff;
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer
    }

    .upl input {
      display: none
    }

    .note {
      font-size: 12.5px;
      color: var(--sub);
      margin: 6px 0 0
    }

    .go {
      border: 0;
      background: var(--lime);
      color: var(--navy);
      border-radius: 9px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer
    }

    .cols {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .col {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700
    }

    .col input[type=color] {
      width: 42px;
      height: 36px;
      padding: 2px;
      border-radius: 8px;
      cursor: pointer
    }

    .col code {
      font-size: 12px;
      color: var(--sub);
      font-weight: 500
    }

    .pal {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px
    }

    .pal button {
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 99px;
      padding: 4px 10px 4px 4px;
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text)
    }

    .pal i {
      display: inline-flex;
      border-radius: 99px;
      overflow: hidden
    }

    .pal i b {
      width: 12px;
      height: 18px;
      display: block
    }

    .tools {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap
    }

    .mini {
      border: 0;
      background: #eef1f7;
      color: var(--navy);
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px
    }

    .m {
      border: 2px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 12px 6px;
      cursor: pointer;
      font: inherit;
      color: var(--text);
      text-align: center
    }

    .m i {
      display: block;
      font-style: normal;
      font-size: 26px;
      line-height: 1.2
    }

    .m b {
      display: block;
      font-size: 14px
    }

    .m.on {
      border-color: var(--orange);
      background: #fff4ec
    }

    .opt {
      margin-top: 14px;
      font-size: 14px
    }

    .opt .line {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px
    }

    .opt select {
      width: auto
    }

    .step {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(15, 31, 61, .06);
      margin-bottom: 14px;
      overflow: hidden;
      border-left: 6px solid var(--navy)
    }

    .step.alt {
      border-left-color: var(--orange)
    }

    .sh {
      padding: 14px 18px;
      background: #f8fafd
    }

    .sh h3 {
      margin: 0;
      font-size: 16px
    }

    .sh h3 small {
      display: block;
      font-weight: 500;
      color: var(--sub);
      font-size: 13px
    }

    .sn {
      color: var(--orange);
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 1px
    }

    .pr {
      border-top: 1px solid var(--line)
    }

    .ph {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 18px 0;
      gap: 8px
    }

    .ph b {
      font-size: 13px;
      color: var(--navy2)
    }

    .copy {
      background: var(--lime);
      color: var(--navy);
      border: 0;
      border-radius: 9px;
      padding: 8px 16px;
      font: inherit;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      margin-left: auto
    }

    pre {
      margin: 0;
      padding: 10px 18px 14px;
      white-space: pre-wrap;
      word-break: keep-all;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      max-height: 320px;
      overflow: auto
    }

    .how {
      padding: 12px 18px 16px;
      border-top: 1px solid var(--line);
      font-size: 14px
    }

    .how ol,
    .how ul {
      margin: 0;
      padding-left: 20px
    }

    .how li {
      margin: 3px 0
    }

    .how .thumb {
      height: 40px;
      vertical-align: middle;
      border: 1px solid var(--line);
      border-radius: 6px;
      margin: 0 4px;
      background: #fff
    }

    .sw {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      vertical-align: -2px;
      border: 1px solid rgba(0, 0, 0, .15);
      margin: 0 2px
    }

    .or {
      text-align: center;
      font-weight: 900;
      color: var(--sub);
      margin: -4px 0 10px;
      font-size: 13px
    }

    .kw {
      display: inline-block;
      background: #fff4ec;
      color: var(--orange);
      border-radius: 6px;
      padding: 0 8px;
      margin: 2px;
      font-size: 13px;
      font-weight: 700
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 90px);
      background: var(--navy);
      color: #fff;
      padding: 10px 20px;
      border-radius: 99px;
      transition: .25s;
      z-index: 9
    }

    .toast.show {
      transform: translate(-50%, 0)
    }

    footer {
      text-align: center;
      color: var(--sub);
      font-size: 12px;
      padding: 10px 0 30px
    }

    @media(max-width:760px) {

      .grid,
      .brand {
        grid-template-columns: 1fr
      }

      .qs {
        grid-template-columns: 1fr
      }

      .menu {
        grid-template-columns: repeat(4, 1fr)
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <span class="badge">SNS 홍보 실습</span>
      <h1>AI로 <em>우리 가게 홍보</em> 한 번에</h1>
      <p>① 칸 몇 개만 채우고 → ② 만들 것을 고르면 → ③ 순서대로 복사해서 붙여넣기만 하세요.</p>
    </div>
  </header>

  <div class="wrap">
    <section class="card lift">
      <p class="title"><span class="n">1</span>우리 가게 정보</p>
      <div class="grid">
        <div><label>가게 이름</label><input id="club" placeholder="콩나무 베이커리"></div>
        <div><label>업종</label><input id="sport" placeholder="베이커리" list="sports">
          <datalist id="sports">
            <option>카페</option>
            <option>베이커리</option>
            <option>음식점</option>
            <option>분식</option>
            <option>반찬가게</option>
            <option>정육점</option>
            <option>꽃집</option>
            <option>미용실</option>
            <option>네일샵</option>
            <option>피부관리실</option>
            <option>필라테스·요가</option>
            <option>공방</option>
            <option>학원</option>
            <option>옷가게</option>
            <option>소품샵</option>
            <option>펜션</option>
            <option>세탁소</option>
            <option>안경원</option>
          </datalist>
        </div>
        <div><label>지역 (동네까지)</label><input id="region" placeholder="서울 관악구 신림동"></div>

        <div class="full brand">
          <div class="sub">
            <label>우리 가게 로고</label>
            <div class="seg" id="hasLogo"><button data-v="1">있어요</button><button class="on" data-v="0">없어요</button>
            </div>
            <div id="logoYes" style="display:none">
              <div class="logoRow">
                <div class="logoPrev" id="logoPrev">미리보기</div>
                <div><label class="upl">📁 로고 파일 올리기<input type="file" id="logoFile" accept="image/*"></label>
                  <p class="note">올리면 로고 색을 자동으로 뽑아 오른쪽 색에 넣어요</p>
                </div>
              </div>
            </div>
            <div id="logoNo">
              <p class="note" style="margin:0 0 8px">로고가 없어도 괜찮아요. 몇 가지만 고르면 AI로 만들 수 있어요.</p>
              <button class="go" id="goLogo">🛡️ 로고 먼저 만들기 →</button>
            </div>
          </div>
          <div class="sub">
            <label>가게 대표 색 <span class="qhint">— 눌러서 바꾸기</span></label>
            <div class="cols">
              <div class="col">메인 <input type="color" id="c1" value="#6b4423"><code id="c1t"></code></div>
              <div class="col">서브 <input type="color" id="c2" value="#e9dcc5"><code id="c2t"></code></div>
              <div class="col">포인트 <input type="color" id="c3" value="#ffffff"><code id="c3t"></code></div>
            </div>
            <div class="pal" id="pal"></div>
            <label style="margin-top:8px;font-weight:500;font-size:13px;display:flex;gap:6px;align-items:center"><input
                type="checkbox" id="useColor" checked style="width:auto"> 프롬프트에 이 색 넣기</label>
          </div>
        </div>

        <div class="full"><label>홍보 목적</label>
          <div class="chips" data-g="purpose">
            <button class="chip on">신메뉴·신상품 출시</button><button class="chip">할인·이벤트</button><button
              class="chip">오픈·리뉴얼</button><button class="chip">체험·클래스 모집</button><button class="chip">영업시간·휴무
              안내</button><button class="chip">후기·단골 감사</button><button class="chip">시즌 인사</button>
          </div>
        </div>
        <div class="full"><label>알리고 싶은 내용 <span class="qhint">— 아는 것만 적어도 돼요 (빈칸은 AI가 [ ]로 비워둬요)</span></label>
          <div class="qs" id="qs"></div>
        </div>
        <div class="full"><label>분위기 <span class="qhint">— 여러 개 골라도 돼요</span></label>
          <div class="chips" data-g="tone" data-multi>
            <button class="chip on">따뜻한 감성</button><button class="chip">밝고 친근한</button><button
              class="chip">깔끔·전문적인</button><button class="chip">고급스러운</button><button
              class="chip">귀여운·아기자기</button><button class="chip">내추럴·친환경</button><button class="chip">정겨운
              동네가게</button><button class="chip">트렌디·힙한</button><button class="chip">레트로·빈티지</button><button
              class="chip">미니멀·심플</button><button class="chip">가성비 강조</button><button class="chip">신뢰감
              있는</button><button class="chip">청량·시원한</button><button class="chip">포근한 겨울</button><button
              class="chip">축제·축하</button>
          </div>
        </div>
      </div>
      <div class="tools"><button class="mini" id="sample">✨ 예시로 채워보기</button><button class="mini" id="reset">↺
          지우기</button></div>
    </section>

    <section class="card" id="menuCard">
      <p class="title"><span class="n">2</span>무엇을 만들까요?</p>
      <div class="menu" id="menu">
        <button class="m on" data-t="card"><i>📱</i><b>카드뉴스</b></button>
        <button class="m" data-t="poster"><i>🖼️</i><b>포스터</b></button>
        <button class="m" data-t="banner"><i>🚩</i><b>배너</b></button>
        <button class="m" data-t="hyun"><i>🎌</i><b>현수막</b></button>
        <button class="m" data-t="logo"><i>🛡️</i><b>로고</b></button>
        <button class="m" data-t="reels"><i>🎬</i><b>릴스·쇼츠</b></button>
        <button class="m" data-t="cal"><i>🗓️</i><b>콘텐츠 캘린더</b></button>
      </div>
      <div class="opt" id="opt"></div>
    </section>

    <p class="title" style="margin:6px 4px 12px"><span class="n">3</span>순서대로 복사 → 붙여넣기</p>
    <div id="steps"></div>
  </div>
  <footer> SNS 홍보 실습용</footer>
  <div class="toast" id="toast">복사했어요! 붙여넣기 하세요</div>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    let type = 'card', logoURL = '';
    const SIZES = {
      card: ['인스타 세로 1080×1350px', '인스타 정사각 1080×1080px'], poster: ['A4 세로 (전단지 겸용)', 'A3 세로', 'SNS 포스터 1080×1350px'],
      banner: ['X배너 600×1800mm', '인스타 스토리 1080×1920px', '웹배너 1200×628px', '네이버 플레이스 사진 1:1'], hyun: ['가로 현수막 5000×900mm', '가로 현수막 3000×700mm', '세로 현수막 900×3000mm']
    };
    const NAME = { card: '카드뉴스', poster: '포스터', banner: '배너', hyun: '현수막' };
    const PAL = [['네이비+연두', '#0f1f3d', '#c6f432', '#ffffff'], ['레드+화이트', '#d62828', '#ffffff', '#1d1d1d'], ['블루+옐로', '#1f4fd1', '#ffd23f', '#ffffff'],
    ['블랙+골드', '#111111', '#d4af37', '#ffffff'], ['그린+화이트', '#1b7f3b', '#ffffff', '#f2c94c'], ['오렌지+네이비', '#ff6b1a', '#14213d', '#ffffff'],
    ['베이지+브라운', '#e9dcc5', '#6b4423', '#ffffff'], ['크림+올리브', '#f6f1e1', '#6b7f3a', '#2b2b2b'], ['핑크+버건디', '#f7c6d0', '#7a1f3d', '#ffffff']];

    const Q = {
      '신메뉴·신상품 출시': [['name', '새 메뉴·상품 이름은?', '딸기 생크림 케이크', '겨울 한정 딸기 생크림 케이크'],
      ['what', '어떤 점이 특별한가요?', '국산 딸기, 수제 생크림', '논산 딸기를 듬뿍, 매일 아침 만드는 수제 생크림'],

- 같은 주제를 채널에 맞게 다르게 재활용해줘 (예: 블로그 글 → 인스타 카드뉴스 → 당근 소식)
- 홍보만 하지 말고 만드는 과정, 손님 이야기, 사장님 꿀팁도 섞어줘

        },
        {
          t: '인스타그램 글 쓰기', s: '캘린더에서 주제 하나 골라 [주제]만 바꿔 붙여넣기', ps: [{
            p:
              `${d.club}(${d.sport}) 인스타그램 게시물을 써줘.
주제: [캘린더의 주제 붙여넣기]

4. 해시태그 15개 (${d.region || '동네'}·${d.sport}·상품 키워드)
5. 카드뉴스로 만들 경우 장별 문구 (5장)`}],
          how: `<ul><li>이미지는 위 메뉴의 <b>카드뉴스</b>에서 만들기 → 미리캔버스로 완성</li></ul>`
        },
        {
          t: '당근 소식 글 쓰기', s: '당근 비즈프로필 → 소식 쓰기', alt: 1, ps: [{

${rule}`
          }],
          how: `<ul><li>사진은 실제 상품·매장 사진 1~3장이 반응이 좋아요</li><li>할인 이벤트가 있다면 비즈프로필 쿠폰 기능도 함께 활용</li></ul>`
        },

- 소제목 4개로 나눈 본문 (1,500자 내외)

        {

            `<ol><li><b>월</b> — 캘린더에서 이번 주 주제 확인, 상품·매장 사진·영상 찍기 (릴스 메뉴 활용)</li>
<li><b>화</b> — 블로그 글 1개 작성 (STEP 4)</li>
<li><b>수</b> — 블로그 글을 인스타 카드뉴스로 바꾸기 (STEP 2 + 미리캔버스)</li>
<li><b>목</b> — 당근 소식 올리기 (STEP 3)</li>
<li><b>금</b> — 댓글·DM 답변, 반응 좋았던 글 메모 → 다음 달 캘린더에 반영</li></ol>`}

    let cur = [];
    function update() {
      const d = D();
      cur = type === 'logo' ? logo(d) : type === 'cal' ? cal(d) : type === 'reels' ? reels(d) : promo(d);
      let n = 0;
      $('steps').innerHTML = cur.map((s, i) => {
        if (s.or) return '<p class="or">— 또는 —</p>';
        n++;
        const ps = (s.ps || []).map((x, j) => `<div class="pr"><div class="ph">${x.l ? `<b>${x.l}</b>` : ''}<button class="copy" data-i="${i}" data-j="${j}">복사하기</button></div><pre>${esc(x.p)}</pre></div>`).join('');
        return `<div class="step ${s.alt ? 'alt' : ''}"><div class="sh"><h3><span class="sn">STEP ${n}</span><br>${s.t}${s.s ? `<small>${s.s}</small>` : ''}</h3></div>${ps}${s.how ? `<div class="how">${s.how}</div>` : ''}</div>`;
      }).join('');
      save();
    }
    $('steps').addEventListener('click', e => {
      const b = e.target.closest('.copy'); if (!b) return; copy(cur[b.dataset.i].ps[b.dataset.j].p);
      b.textContent = '복사됨 ✓'; setTimeout(() => b.textContent = '복사하기', 1500)
    });
    function copy(t) {
      const ok = () => { $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 1400) };
      const fb = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok() } catch (e) { } a.remove() };
      try { navigator.clipboard.writeText(t).then(ok, fb) } catch (e) { fb() }
    }

    function save() {
      try {
        localStorage.setItem('sbp1', JSON.stringify({
          club: $('club').value, sport: $('sport').value, region: $('region').value,
          purpose: chip('purpose'), tone: chip('tone'), ans: ANS, logo: LOGO, cols: colors(), useColor: $('useColor').checked
        }))
      } catch (e) { }
    }
    function load(o) {
      ['club', 'sport', 'region'].forEach(k => $(k).value = o[k] || ''); setChip('purpose', o.purpose || '신메뉴·신상품 출시'); setChip('tone', o.tone || '따뜻한 감성');
      ANS = o.ans || {}; LOGO = o.logo || { shape: '원형 배지', sym: '대표 상품', symText: '', eng: '' };
      (o.cols || ['#6B4423', '#E9DCC5', '#FFFFFF']).forEach((c, i) => $('c' + (i + 1)).value = c.toLowerCase()); $('useColor').checked = o.useColor !== false;
      showHex(); drawQs(); drawOpt();
    }
    $('sample').onclick = () => {
      const p = chip('purpose'), a = {}; Q[p].forEach(([k, , , s]) => a[k] = s); ANS[p] = a;
      load({
        club: $('club').value || '콩나무 베이커리', sport: $('sport').value || '베이커리', region: $('region').value || '서울 남동구 금은동',
        purpose: p, tone: chip('tone'), ans: ANS, logo: Object.assign({}, LOGO, { symText: LOGO.symText || '식빵, 밀 이삭', eng: LOGO.eng || 'JOEUN BAKERY' }), cols: colors(), useColor: $('useColor').checked
      }); update()
    };
    $('reset').onclick = () => { load({}); logoURL = ''; $('logoPrev').textContent = '미리보기'; update() };
    try { const o = JSON.parse(localStorage.getItem('sbp1') || 'null'); load(o || {}) } catch (e) { load({}) }
    update();
  </script>
