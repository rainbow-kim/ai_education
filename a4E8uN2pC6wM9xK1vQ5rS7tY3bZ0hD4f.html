<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 숏폼·상세페이지 실습 워크북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root {
  /* 덱과 같은 인디고 계열: 왼쪽 단계 레일 + 오른쪽 작업 시트 */
  --ink: #141F5C;
  --body: #3E4258;
  --muted: #6A6F86;
  --brand: #4C5BA9;
  --brand-soft: #E9F0FE;
  --paper: #FFFFFF;
  --canvas: #F3F6FD;
  --line: #D5DCF0;
  --ok: #1F7A4D;
  --ok-soft: #E3F4EA;
  --warn: #A15C00;
  --warn-soft: #FFF2DC;
  --font: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--canvas); color: var(--body); font: 16px/1.65 var(--font); }
h1, h2, h3, h4 { color: var(--ink); line-height: 1.3; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #8E9AE0; outline-offset: 2px; }
a { color: var(--brand); }

.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--ink); color: #DDE3FA; padding: 24px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.rail .brandmark { padding: 0 8px; }
.rail .brandmark small { display: block; color: #9AA6E6; font-size: 12px; letter-spacing: .08em; font-weight: 700; }
.rail .brandmark strong { display: block; color: #fff; font-size: 17px; line-height: 1.35; margin-top: 4px; }
.progress { padding: 0 8px; }
.progress .bar { height: 8px; background: #2B3878; border-radius: 99px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: #8FA0F2; width: 0; transition: width .3s; }
.progress p { margin: 6px 0 0; font-size: 13px; color: #B9C3F2; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps button { width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 10px 10px; display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; cursor: pointer; color: #DDE3FA; }
.steps button:hover { background: #1E2B70; }
.steps button[aria-current="step"] { background: #fff; color: var(--ink); }
.steps .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: #2B3878; color: #fff; }
.steps button[aria-current="step"] .num { background: var(--brand); }
.steps .lbl { font-size: 14px; line-height: 1.35; }
.steps .lbl small { display: block; font-size: 11.5px; opacity: .75; }
.pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.todo { background: #2B3878; color: #B9C3F2; }
.pill.doing { background: #FFE3A8; color: #6B3D00; }
.pill.done { background: #BFEBD2; color: #0E5533; }
.steps button[aria-current="step"] .pill.todo { background: var(--brand-soft); color: var(--brand); }
.savebox { margin-top: auto; padding: 12px; border-radius: 12px; background: #1E2B70; font-size: 13px; }
.savebox p { margin: 0 0 8px; color: #C9D1F6; }
.savebox button { width: 100%; }

main { padding: 32px clamp(16px, 4vw, 56px) 96px; }
.sheet { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.stephead { display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--brand); letter-spacing: .04em; }
.stephead h1 { font-size: clamp(26px, 3.4vw, 34px); font-weight: 900; }
.stephead .lead { font-size: 17px; max-width: 65ch; margin: 0; }
.goal { display: flex; flex-wrap: wrap; gap: 8px; }
.goal span { background: var(--paper); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 13.5px; }
.goal b { color: var(--brand); }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.card > h2 { font-size: 20px; display: flex; gap: 10px; align-items: center; }
.card > h2 .tag { font-size: 12px; font-weight: 700; background: var(--brand-soft); color: var(--brand); padding: 3px 10px; border-radius: 99px; }
.concept { display: flex; flex-direction: column; gap: 14px; }
.concept h3 { font-size: 17px; }
.concept p { margin: 0; max-width: 70ch; }
.concept ul, .concept ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--canvas); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.tile b { color: var(--ink); }
.tile p, .tile li { font-size: 14.5px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--brand-soft); color: var(--ink); font-weight: 700; }
.note { background: var(--warn-soft); color: #5B3600; border-radius: 12px; padding: 12px 16px; font-size: 14.5px; }
.note b { color: #5B3600; }

fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 18px; }
.sec { display: flex; flex-direction: column; gap: 16px; padding-top: 4px; }
.sec + .sec { border-top: 1px dashed var(--line); padding-top: 20px; }
.sec > h3 { font-size: 16.5px; }
.sec > p.sub { margin: -10px 0 0; font-size: 14px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .flabel { font-weight: 700; color: var(--ink); font-size: 15px; }
.field .hint { font-size: 13.5px; color: var(--muted); margin: -2px 0 0; }
.field input[type=text], .field input[type=date], .field textarea, .field select { width: 100%; border: 1px solid #C3CBE6; border-radius: 10px; padding: 10px 12px; background: #FBFCFF; }
.field textarea { min-height: 88px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--brand); background: #fff; }
.counter { font-size: 12.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.counter.over { color: #B42318; font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts label { display: inline-flex; gap: 8px; align-items: center; border: 1px solid #C3CBE6; border-radius: 10px; padding: 8px 12px; cursor: pointer; background: #FBFCFF; font-size: 14.5px; }
.opts label:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); color: var(--ink); font-weight: 500; }
.opts input { accent-color: var(--brand); }
.opts.col { flex-direction: column; }
.opts.col label { align-items: flex-start; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.linked { background: var(--brand-soft); border-radius: 12px; padding: 12px 16px; font-size: 14.5px; display: flex; flex-direction: column; gap: 4px; }
.linked b { color: var(--ink); }
.linked .miss { color: #B42318; }

.prompt { border: 1px solid #BFC8EC; border-radius: 14px; overflow: hidden; }
.prompt header { background: var(--ink); color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.prompt header strong { font-size: 15px; }
.prompt header small { color: #B9C3F2; display: block; font-size: 12.5px; }
.prompt pre { margin: 0; padding: 16px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; font: 14px/1.7 var(--font); background: #FAFBFF; max-height: 460px; overflow-y: auto; }
.prompt pre mark { background: #FFE3A8; color: #6B3D00; border-radius: 4px; padding: 0 3px; }
.prompt .pfoot { padding: 10px 16px; background: #F0F3FC; font-size: 13.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }

.btn { border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; font-size: 14.5px; }
.btn:hover { background: #3E4C97; }
.btn.ghost { background: #fff; color: var(--brand); }
.btn.ghost:hover { background: var(--brand-soft); }
.btn.light { background: #fff; color: var(--ink); border-color: #fff; }
.btn.small { padding: 6px 12px; font-size: 13.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.checklist { display: flex; flex-direction: column; gap: 8px; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--canvas); cursor: pointer; font-size: 15px; }
.checklist label:has(input:checked) { background: var(--ok-soft); color: #134A30; }
.checklist input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--ok); flex: none; }
.donebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--ok-soft); border: 1px solid #A9DDBF; border-radius: 14px; padding: 16px 18px; }
.donebar label { display: flex; gap: 10px; align-items: center; font-weight: 700; color: #134A30; cursor: pointer; }
.donebar input { width: 22px; height: 22px; accent-color: var(--ok); }
.donebar p { margin: 0; font-size: 14px; color: #2C6447; }

.pager { display: flex; justify-content: space-between; gap: 12px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; }
.exports { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.exports .tile { gap: 8px; }
.exports .tile .btn { align-self: flex-start; }
.status { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.status .tile { gap: 2px; }
.status .tile span { font-size: 13px; color: var(--muted); }
.hidden { display: none !important; }

#report { position: fixed; left: -10000px; top: 0; width: 794px; background: #fff; color: #222; font: 13px/1.6 var(--font); padding: 0; }
#report .rp { padding: 40px 44px; display: flex; flex-direction: column; gap: 10px; }
#report h1 { font-size: 24px; color: var(--ink); }
#report h2 { font-size: 17px; color: var(--ink); border-bottom: 2px solid var(--brand); padding-bottom: 4px; margin-top: 6px; }
#report h3 { font-size: 14px; color: var(--brand); margin-top: 4px; }
#report table { font-size: 12px; }
#report th { width: 32%; }
#report pre { white-space: pre-wrap; word-break: keep-all; font: 11.5px/1.6 var(--font); background: #F5F7FD; padding: 10px; border-radius: 6px; margin: 0; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; padding: 14px 12px; gap: 10px; }
  .steps { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .steps li { flex: none; }
  .steps button { grid-template-columns: 26px auto; }
  .steps .pill { display: none; }
  .savebox { display: none; }
  .grid3, .status { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .grid2, .grid3, .row2, .exports, .status { grid-template-columns: 1fr; }
  .card { padding: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* v2 추가: 모드 스위치, 파트 탭, 칩, 예시, 갤러리, 캘린더 */
.mode { padding: 0 8px; display: flex; flex-direction: column; gap: 6px; }
.mode .seg { display: grid; grid-template-columns: 1fr 1fr; background: #2B3878; border-radius: 10px; padding: 3px; }
.mode .seg button { border: 0; background: none; color: #C9D1F6; border-radius: 8px; padding: 7px 4px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.mode .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); }
.mode p { margin: 0; font-size: 12px; color: #9AA6E6; line-height: 1.45; }

.parts { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--line); padding-bottom: 0; }
.parts button { border: 0; background: none; padding: 10px 14px; font-size: 14.5px; font-weight: 700; color: var(--muted); cursor: pointer; border-radius: 10px 10px 0 0; margin-bottom: -2px; border-bottom: 3px solid transparent; }
.parts button:hover { color: var(--ink); background: var(--brand-soft); }
.parts button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
.parts button .pn { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 12px; margin-right: 6px; }
.parts button[aria-selected="true"] .pn { background: var(--brand); color: #fff; }
.parthint { font-size: 13.5px; color: var(--muted); margin: -8px 0 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid #C3CBE6; border-radius: 99px; padding: 7px 14px; cursor: pointer; background: #FBFCFF; font-size: 14.5px; line-height: 1.3; }
.chips label:has(input:checked) { border-color: var(--brand); background: var(--brand); color: #fff; }
.chips input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chips label:has(input:focus-visible) { outline: 3px solid #8E9AE0; outline-offset: 2px; }
.chips label::before { content: "+"; font-weight: 700; color: var(--brand); }
.chips label:has(input:checked)::before { content: "✓"; color: #fff; }
.note-in { display: flex; gap: 8px; align-items: center; }
.note-in span { font-size: 13px; color: var(--muted); white-space: nowrap; }
.note-in input { flex: 1; }
.multi-hint { font-size: 12.5px; color: var(--muted); }

.exrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.exrow > span { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.exbtn { border: 1px dashed #A9B4E0; background: #fff; color: var(--brand); border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.exbtn:hover { background: var(--brand-soft); border-style: solid; }
.exbtn b { color: var(--ink); font-weight: 700; margin-right: 4px; }
.frombtn { align-self: flex-start; }
.field .lrow { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.field .core { font-size: 11px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border-radius: 99px; padding: 1px 8px; margin-left: 6px; vertical-align: middle; }

.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.gcard { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
.gcard header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.gcard header b { color: var(--ink); font-size: 15.5px; }
.gcard header span { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); }
.gcard dl { margin: 0; display: grid; grid-template-columns: 74px 1fr; gap: 4px 10px; font-size: 14px; }
.gcard dt { color: var(--muted); font-weight: 700; }
.gcard dd { margin: 0; }
.gcard .en { font-size: 12.5px; color: #4A5072; background: var(--canvas); border-radius: 8px; padding: 8px 10px; line-height: 1.55; }
.gcard .btn { align-self: flex-start; }
.filter { display: flex; flex-wrap: wrap; gap: 6px; }
.filter button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--body); }
.filter button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

.manual { counter-reset: m; display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.manual li { counter-increment: m; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; background: var(--canvas); border-radius: 12px; padding: 12px 14px; }
.manual li::before { content: counter(m); width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.manual li b { color: var(--ink); }
.manual li p { margin: 2px 0 0; font-size: 14.5px; }

.cal { font-size: 14px; }
.cal td, .cal th { white-space: nowrap; }
.cal td.wrap { white-space: normal; min-width: 160px; }
.cal tr.check td { background: var(--warn-soft); }
.cal tr.weekstart td { border-top: 2px solid var(--brand); }
.cal input { width: 100%; min-width: 180px; border: 1px solid #C3CBE6; border-radius: 8px; padding: 6px 8px; background: #FBFCFF; }
.calsum { display: flex; gap: 8px; flex-wrap: wrap; }
.calsum span { background: var(--brand-soft); border-radius: 99px; padding: 4px 12px; font-size: 13.5px; color: var(--ink); }
.pastebox { border-left: 0; background: #F7F9FF; border: 1px dashed #A9B4E0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.pastebox > .flabel, .pastebox > label { font-weight: 700; color: var(--ink); }
.field .lrow .flabel { font-weight: 700; color: var(--ink); font-size: 15px; }
.prompt .tabs { display: flex; gap: 4px; padding: 8px 12px 0; background: #F0F3FC; }
.prompt .tabs button { border: 0; background: none; padding: 7px 14px; border-radius: 8px 8px 0 0; font-weight: 700; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.prompt .tabs button[aria-selected="true"] { background: #FAFBFF; color: var(--brand); }
@media (max-width: 900px) { .mode { padding: 0; } .gallery { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="실습 단계">
    <div class="brandmark"><small>AI 숏폼 & 판매·예약 최적화</small><strong>4시간 실습 워크북</strong></div>
    <div class="mode"><div class="seg" role="group" aria-label="질문 보기 방식"><button type="button" data-mode="simple" aria-pressed="true">간단 모드</button><button type="button" data-mode="detail" aria-pressed="false">상세 모드</button></div><p>간단 모드는 핵심 질문과 짧은 프롬프트만 보여줍니다.</p></div>
    <div class="progress"><div class="bar"><i id="pbar"></i></div><p id="ptext">0 / 8 단계 완료</p></div>
    <ol class="steps" id="stepnav"></ol>
    <div class="savebox"><p id="savestate">작성 내용은 이 브라우저에 자동으로 임시 저장됩니다.</p><button class="btn light small" type="button" data-go="finish" data-gp="2">저장·내보내기로 이동</button></div>
  </nav>
  <main><div class="sheet" id="sheet"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="report" aria-hidden="true"></div>
<input type="file" id="importfile" accept=".json,application/json" class="hidden">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ===== 필드 생성기 ===== */
function T(id, label, o) { return Object.assign({ id: id, type: 'text', label: label }, o || {}); }
function A(id, label, o) { return Object.assign({ id: id, type: 'textarea', label: label }, o || {}); }
function C(id, label, opts, o) { return Object.assign({ id: id, type: 'chips', label: label, opts: opts }, o || {}); }
function D(id, label, o) { return Object.assign({ id: id, type: 'date', label: label }, o || {}); }
function PASTE(id, label, pid, o) { return Object.assign({ id: id, type: 'textarea', label: label, paste: true, prompt: pid, rows: 6, core: true }, o || {}); }
function PR(pid) { return { type: 'prompt', pid: pid, core: true }; }
function HTML(h) { return { type: 'html', html: h, core: true }; }

var TYPES = ['제품판매형', '매장서비스형', '교육·전문서비스형'];

function clipSec(n) {
  var sceneEx = [
    [['화장품', '앰플 병 클로즈업'], ['카페', '라떼 잔 위에서'], ['미용실', '부스스한 옆머리를 만지는 손님'], ['드로잉클래스', '빈 도화지 앞에서 망설이는 손'], ['국밥집', '끓는 검은 뚝배기']],
    [['화장품', '화이트 배경 제품 단독'], ['미용실', '모발 결을 살피는 디자이너 손'], ['필라테스', '리포머 위 강사'], ['드로잉클래스', '강사의 선 긋기 시범'], ['세무상담', '서류를 가리키며 설명하는 손']],
    [['화장품', '세안 후 바르는 손'], ['미용실', '드라이 후 거울 속 완성 스타일'], ['꽃집', '크라프트지로 감싸는 꽃다발'], ['드로잉클래스', '완성작을 들고 웃는 수강생'], ['펜션', '바다가 보이는 통창']],
    [['화장품', '제품 정면 + CTA 여백'], ['카페', '매장 입구 간판'], ['공부방', '정리된 책상과 칠판'], ['드로잉클래스', '수업 공간 전경'], ['네일샵', '완성된 손끝 클로즈업']]
  ][n - 1];
  return { title: '클립 ' + n + (n === 4 ? ' (선택)' : ''), fields: [
    T('c' + n + '_scene', '① 피사체 (무엇이 보이나)', { core: n < 4, examples: sceneEx }),
    C('c' + n + '_act', '② 동작', ACTS, { core: n < 4 }),
    C('c' + n + '_cam', '③ 카메라', CAMS, { core: n < 4 }),
    C('c' + n + '_light', '④ 조명', LIGHTS),
    C('c' + n + '_style', '⑤ 스타일', STYLES)
  ]};

  var ex = t.closest('[data-ex]'); if (ex) { var fid = ex.getAttribute('data-ex'); var f = FIELDS[fid]; setVal(fid, f.examples[+ex.getAttribute('data-i')][1]); toast('예시를 넣었습니다. 내 사업에 맞게 고쳐 쓰세요.'); return; }
  var fr = t.closest('[data-from]'); if (fr) {
    var id = fr.getAttribute('data-from'), src = FIELDS[id].from;
    if (FIELDS[id].type === 'chips') { state.v[id] = arr(src).slice(); state.v[id + '__note'] = state.v[src + '__note'] || ''; save(); render(); }
    else setVal(id, val(src));
    toast(val(src) ? '앞 단계 답을 가져왔습니다.' : '앞 단계에 아직 답이 없습니다.'); return;
  }
  var gf = t.closest('[data-gfilter]'); if (gf) {
    var kind = gf.getAttribute('data-gfilter'), grp = gf.getAttribute('data-g');
    document.querySelectorAll('[data-gfilter="' + kind + '"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === gf)); });
    document.querySelectorAll('#gal_' + kind + ' .gcard').forEach(function (cd) { cd.classList.toggle('hidden', grp !== '전체' && cd.getAttribute('data-group') !== grp); });
    return;
  }
  var gl = t.closest('[data-gfill]'); if (gl) {
    var i = +gl.getAttribute('data-i');
    if (gl.getAttribute('data-gfill') === 'fix') {
      var e1 = FIX_EX[i]; state.v.model_look = e1.m; state.v.obj_fix = e1.o; state.v.fx_light__note = e1.l; state.v.bans__note = e1.b;
      save(); render(); toast(e1.t + ' 예시를 넣었습니다. 아래 칸에서 내 사업에 맞게 고치세요.');
    } else {
      var e2 = CLIP_EX[i], n = gl.getAttribute('data-n');
      state.v['c' + n + '_scene'] = e2.s; state.v['c' + n + '_act__note'] = e2.a; state.v['c' + n + '_cam__note'] = e2.c; state.v['c' + n + '_light__note'] = e2.l; state.v['c' + n + '_style__note'] = e2.y;
      save(); toast(e2.t + ' 예시를 클립 ' + n + '에 넣었습니다. "클립 ' + (n < 3 ? '1·2' : '3·4') + '" 탭에서 고치세요.');
    }
    renderNav(); return;
  }
});
function setVal(id, v) {
  state.v[id] = v; save();
  var el = document.getElementById('f_' + id); if (el) { el.value = v; var f = FIELDS[id]; if (f.max) updCounter(id); }
  refresh(); renderNav();
}
function updCounter(id) { var c = document.getElementById('c_' + id); if (!c) return; var len = (state.v[id] || '').length; c.textContent = len + ' / ' + FIELDS[id].max + '자'; c.classList.toggle('over', len > FIELDS[id].max); }
var calFields = ['cal_start', 'cal_weeks', 'cal_days', 'cal_platforms', 'cal_pillars', 'cal_formats', 'upload_date', 'platforms', 'ops_platforms', 'ops_pillars', 'one_format'];
document.addEventListener('input', function (e) {
  var t = e.target;
  var cm = t.getAttribute && t.getAttribute('data-calmemo'); if (cm) { state.v['calmemo_' + cm] = t.value; save(); refresh(); return; }
  var nt = t.getAttribute && t.getAttribute('data-note'); if (nt) { state.v[nt + '__note'] = t.value; save(); refresh(); renderNav(); if (calFields.indexOf(nt) >= 0) refreshCal(); return; }
  var f = t.getAttribute && t.getAttribute('data-f'); if (!f) return;
  var def = FIELDS[f];
  if (def.type === 'chips') state.v[f] = Array.prototype.slice.call(document.querySelectorAll('input[data-f="' + f + '"]:checked')).map(function (x) { return x.value; });
  else state.v[f] = t.value;
  if (def.max) updCounter(f);
  save(); refresh(); renderNav();
  if (calFields.indexOf(f) >= 0) refreshCal();
});
document.addEventListener('change', function (e) {
  var k = e.target.getAttribute && e.target.getAttribute('data-chk');
  if (k) { state.chk[k] = e.target.checked; save(); updateChk(STEPS[stepIndex(cur.step)]); renderNav(); return; }
  var d = e.target.getAttribute && e.target.getAttribute('data-done');
  if (d) { state.done[d] = e.target.checked; save(); renderNav(); if (e.target.checked) toast(STEPS[stepIndex(d)].nav + ' 완료! 다음 단계로 넘어가세요.'); }
});
window.addEventListener('hashchange', function () { var h = parseHash(); if (h && (h.step !== cur.step || h.part !== cur.part)) go(h.step, h.part, true); });

var toastT = null;
function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 2600); }
function copyText(t, ok) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast(ok); }, function () { fallbackCopy(t, ok); });
  else fallbackCopy(t, ok);
}
function fallbackCopy(t, ok) {
  var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
  var r = false; try { r = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta); toast(r ? ok : '복사가 막혔습니다. 내용을 길게 눌러 직접 선택해 복사하세요.');
}

/* ---------- 내보내기 ---------- */
function rows() {
  var out = [['단계', '구분', '항목', '내용']];
  STEPS.forEach(function (s) {
    var sn = s.nav + ' ' + s.sub, pids = [];
    s.parts.forEach(function (p) { (p.sections || []).forEach(function (sec) { sec.fields.forEach(function (f) {
      if (f.type === 'prompt') { pids.push(f.pid); return; }
      if (!f.id) return;
      if (f.paste) pids.push(f.prompt);
      out.push([sn, sec.title, f.label, val(f.id)]);
    }); }); });
    pids.forEach(function (pid) { out.push([sn, '프롬프트', PROMPTS[pid].title, plainPrompt(buildPrompt(pid, false).text)]); });
    if (s.id === 'finish') calRows().rows.forEach(function (r) { out.push([sn, '운영 캘린더', r.date + ' (' + r.day + ')', (r.only ? '업로드 없음' : r.plats + ' / ' + r.pillar + ' / ' + r.format) + (r.check ? ' / ' + r.check : '') + (val('calmemo_' + r.key) ? ' / 메모: ' + val('calmemo_' + r.key) : '')]); });
    s.checklist.forEach(function (c, k) { out.push([sn, '체크리스트', c, state.chk[s.id + ':' + k] ? '완료' : '미완료']); });
    out.push([sn, '단계 상태', '실습 완료', state.done[s.id] ? '완료' : '미완료']);
  });
  return out;
}
function toTSV(r) { return r.map(function (row) { return row.map(function (c) { c = String(c); return /[\t\n"]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join('\t'); }).join('\n'); }
function csv() { return '﻿' + rows().map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n'); }
function fname(ext) { var b = (val('biz_name') || '내사업').replace(/[\\\/:*?"<>|]/g, ''); var d = new Date(); return b + '_AI숏폼실습워크북_' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.' + ext; }
var dl = null;
function getDownloads() {
  if (dl !== null) return Promise.resolve(dl);
  if (!window.claude || !window.claude.use) return Promise.resolve(null);
  return window.claude.use('downloads').then(function (d) { dl = d || null; return dl; }, function () { return null; });
}
function saveFile(filename, data) {
  return getDownloads().then(function (d) {
    if (!d) { toast('이 화면에서는 파일 저장이 지원되지 않습니다. "시트용 표 복사"를 이용하세요.'); return; }
    return d.save({ filename: filename, data: data }).then(function () { toast('저장했습니다: ' + filename); }, function (err) {
      var c = err && err.code;
      toast(c === 'declined' ? '저장을 취소했습니다.' : c === 'rate_limited' ? '저장 창이 이미 열려 있습니다. 잠시 후 다시 눌러주세요.' : '파일 저장이 지원되지 않습니다. "시트용 표 복사"를 이용하세요.');
    });
  });
}
function reportBlocks() {
  var blocks = ['<div class="rp"><h1>AI 숏폼·상세페이지 실습 워크북</h1><p>' + esc(val('name') || '이름 미입력') + ' · ' + esc(val('biz_name') || '업체명 미입력') + ' · ' + esc(val('biz_type')) + ' · 작성일 ' + new Date().toLocaleDateString('ko-KR') + '</p><table>' + STEPS.map(function (s) { var n = s.checklist.filter(function (_, k) { return state.chk[s.id + ':' + k]; }).length; return '<tr><th>' + esc(s.nav + ' · ' + s.sub) + '</th><td>' + (state.done[s.id] ? '완료' : '진행 중') + ' (체크 ' + n + '/' + s.checklist.length + ')</td></tr>'; }).join('') + '</table></div>'];
  STEPS.forEach(function (s) {
    var b = '<div class="rp"><h2>' + esc(s.nav + ' · ' + s.sub) + '</h2>', pids = [];
    s.parts.forEach(function (p) { (p.sections || []).forEach(function (sec) {
      sec.fields.forEach(function (f) { if (f.type === 'prompt') pids.push(f.pid); else if (f.paste) pids.push(f.prompt); });
      var filled = sec.fields.filter(function (f) { return f.id && val(f.id); });
      if (filled.length) b += '<h3>' + esc(sec.title) + '</h3><table>' + filled.map(function (f) { return '<tr><th>' + esc(f.label) + '</th><td>' + esc(val(f.id)).replace(/\n/g, '<br>') + '</td></tr>'; }).join('') + '</table>';
    }); });
    if (s.id === 'finish') { var c = calRows(); b += '<h3>콘텐츠 운영 캘린더</h3><table>' + c.rows.map(function (r) { return '<tr><th>' + r.week + '주 ' + r.date + ' (' + r.day + ')</th><td>' + esc(r.only ? '업로드 없음' : r.plats + ' / ' + r.pillar + ' / ' + r.format) + (r.check ? ' / <b>' + esc(r.check) + '</b>' : '') + (val('calmemo_' + r.key) ? ' / ' + esc(val('calmemo_' + r.key)) : '') + '</td></tr>'; }).join('') + '</table>'; }
    b += '<h3>체크리스트</h3><table>' + s.checklist.map(function (c, k) { return '<tr><th>' + (state.chk[s.id + ':' + k] ? '☑ 완료' : '☐ 미완료') + '</th><td>' + esc(c) + '</td></tr>'; }).join('') + '</table></div>';
    blocks.push(b);
    pids.forEach(function (pid) { blocks.push('<div class="rp"><h3>' + esc(PROMPTS[pid].title) + '</h3><pre>' + esc(plainPrompt(buildPrompt(pid, false).text)) + '</pre></div>'); });
  });
  return blocks;
}
function makePDF(btn) {
  if (!window.html2canvas || !window.jspdf) { toast('PDF 도구를 불러오지 못했습니다. 새로고침 후 다시 시도하세요.'); return; }
  btn.disabled = true; btn.textContent = 'PDF 만드는 중…';
  var rep = document.getElementById('report'), pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
  var PW = pdf.internal.pageSize.getWidth(), PH = pdf.internal.pageSize.getHeight(), M = 24, W = PW - M * 2, y = M, first = true, chain = Promise.resolve();
  reportBlocks().forEach(function (bh) {
    chain = chain.then(function () {
      rep.innerHTML = bh;
      return window.html2canvas(rep, { scale: 2, backgroundColor: '#ffffff', logging: false }).then(function (cv) {
        var ratio = W / cv.width, off = 0;
        while (off < cv.height) {
          var room = PH - M - y;
          if (room < 60 && !first) { pdf.addPage(); y = M; room = PH - M * 2; }
          var slice = Math.min(cv.height - off, Math.floor(room / ratio));
          var sc = document.createElement('canvas'); sc.width = cv.width; sc.height = slice;
          sc.getContext('2d').drawImage(cv, 0, off, cv.width, slice, 0, 0, cv.width, slice);
          pdf.addImage(sc.toDataURL('image/jpeg', 0.92), 'JPEG', M, y, W, slice * ratio);
          y += slice * ratio; off += slice; first = false;
          if (off < cv.height) { pdf.addPage(); y = M; }
        }
        y += 6;
      });
    });
  });
  chain.then(function () { rep.innerHTML = ''; return saveFile(fname('pdf'), pdf.output('blob')); })
    .catch(function () { toast('PDF를 만들지 못했습니다. "시트용 표 복사"를 이용하세요.'); })
    .then(function () { btn.disabled = false; btn.textContent = 'PDF 만들기'; });
}
function wireExports() {
  getDownloads().then(function (d) { if (!d) { ['x_pdf', 'x_csv', 'x_json'].forEach(function (id) { var b = document.getElementById(id); if (b) b.disabled = true; }); var na = document.getElementById('x_na'); if (na) na.classList.remove('hidden'); } });
  document.getElementById('x_pdf').onclick = function () { makePDF(this); };
  document.getElementById('x_tsv').onclick = function () { copyText(toTSV(rows()), '표를 복사했습니다. 새 구글 시트의 A1 칸에 붙여넣으세요.'); };
  document.getElementById('x_csv').onclick = function () { saveFile(fname('csv'), csv()); };
  document.getElementById('x_json').onclick = function () { saveFile(fname('json'), JSON.stringify(state, null, 1)); };
  document.getElementById('x_import').onclick = function () { document.getElementById('importfile').click(); };
  document.getElementById('x_reset').onclick = function () {
    var b = this;
    if (b.getAttribute('data-arm') !== '1') { b.setAttribute('data-arm', '1'); b.textContent = '정말 지울까요? 한 번 더 누르면 모두 지워집니다'; setTimeout(function () { b.removeAttribute('data-arm'); b.textContent = '모든 내용 지우고 새로 시작'; }, 4000); return; }
    var m = state.mode; state = { v: {}, chk: {}, done: {}, mode: m }; if (store) { try { store.removeItem(KEY); store.removeItem(OLDKEY); } catch (e) {} } go('intro', 0); toast('모든 내용을 지웠습니다.');
  };
}
function wireCal() {
  var b = document.getElementById('cal_copy');
  if (b) b.onclick = function () {
    var r = [['주차', '날짜', '요일', 'SNS', '콘텐츠 기둥', '형식', '성과 점검', '메모']].concat(calRows().rows.map(function (x) { return [x.week + '주', x.date, x.day, x.only ? '' : x.plats, x.only ? '' : x.pillar, x.only ? '' : x.format, x.check, val('calmemo_' + x.key)]; }));
    copyText(toTSV(r), '캘린더를 복사했습니다. 구글 시트 A1 칸에 붙여넣으세요.');
  };
}
document.getElementById('importfile').addEventListener('change', function () {
  var f = this.files && this.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try { var d = JSON.parse(r.result); if (!d || typeof d.v !== 'object') throw 0; state = (d.mode ? { v: d.v || {}, chk: d.chk || {}, done: d.done || {}, mode: d.mode } : migrate(d)); save(); go(cur.step, cur.part); toast('백업을 불러왔습니다.'); }
    catch (e) { toast('이 파일은 워크북 백업 파일이 아닙니다.'); }
  };
  r.readAsText(f); this.value = '';
});

/* ---------- 시작 ---------- */
load();
var h0 = parseHash();
if (h0 && stepIndex(h0.step) >= 0) go(h0.step, h0.part, true); else go('intro', 0, true);
if (state.updated) setSaveState('이 브라우저에 임시 저장됨 · 마지막 ' + hm(new Date(state.updated)));
})();
