<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1인 대표 SNS 마케팅 실습 워크북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* 메인 컬러 딥 옐로우. 노란 면 위 글자는 진한 갈색, 흰 바탕 위 강조 글자는 황갈색으로 대비 확보.
     레이아웃: 좌측 단계 내비 + 우측 작업 영역, 한 단계 = 한 페이지 */
  --ink:#1f1d17; --sub:#575247; --line:#e4dfd2; --paper:#ffffff; --bg:#f6f5f1;
  --brand:#e3a008; --brand-ink:#241a00; --accent:#8a5a00; --brand-soft:#fff3d1; --brand-line:#f0cf72;
  --code:#26231c; --code-ink:#f7f3e8; --fill:#ffd166; --miss-bg:#ffb4a2; --miss-ink:#3a0d00;
  --ok:#2c7a4f; --ok-soft:#e4f3ea; --warn:#a4470f; --warn-soft:#fdebdc;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#f1ede3; --sub:#bdb6a5; --line:#3b372c; --paper:#211f19; --bg:#171611;
  --brand:#f2b824; --brand-ink:#1e1600; --accent:#f5c95a; --brand-soft:#3a3016; --brand-line:#6b5418;
  --code:#0f0e0a; --code-ink:#f7f3e8; --fill:#ffd166; --miss-bg:#ff9f87; --miss-ink:#2a0900;
  --ok:#6fd19b; --ok-soft:#173326; --warn:#f2a36a; --warn-soft:#3b2414; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#f1ede3; --sub:#bdb6a5; --line:#3b372c; --paper:#211f19; --bg:#171611;
  --brand:#f2b824; --brand-ink:#1e1600; --accent:#f5c95a; --brand-soft:#3a3016; --brand-line:#6b5418;
  --code:#0f0e0a; --code-ink:#f7f3e8; --fill:#ffd166; --miss-bg:#ff9f87; --miss-ink:#2a0900;
  --ok:#6fd19b; --ok-soft:#173326; --warn:#f2a36a; --warn-soft:#3b2414; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100%}
aside{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:16px}
.logo{font-size:19px;font-weight:800;line-height:1.35}
.logo .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--brand);margin-right:8px;vertical-align:1px}
.logo small{display:block;font-size:13px;color:var(--sub);font-weight:500;margin-top:4px}
.prog .bar{height:10px;background:var(--brand-soft);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.prog span{font-size:14px;color:var(--sub);display:block;margin-top:6px}
nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
nav button{width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:10px;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;cursor:pointer}
nav button:hover{background:var(--brand-soft)}
nav button[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
nav .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;border:2px solid var(--line);background:var(--paper);color:var(--sub)}
nav button[aria-current="page"] .no{border-color:var(--brand-ink);color:var(--brand-ink)}
nav .done .no{background:var(--ok);border-color:var(--ok);color:#fff}
nav .t{font-size:15px;line-height:1.35;font-weight:700}
nav .t small{display:block;font-size:12.5px;opacity:.75;font-weight:500}
.side-foot{margin-top:auto;font-size:13px;color:var(--sub);line-height:1.6}
main{padding:28px clamp(16px,4vw,52px) 90px;max-width:1060px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:4;background:var(--bg);padding:10px 0;margin:-10px 0 4px}
.eyebrow{font-size:14px;font-weight:800;letter-spacing:.06em;color:var(--accent)}
.history{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.saved{font-size:13px;color:var(--sub);margin-right:6px}
h1{font-size:clamp(28px,3.4vw,36px);font-weight:800;line-height:1.3;margin:4px 0 10px;text-wrap:balance}
.lead{color:var(--sub);max-width:64ch;margin:0 0 26px;font-size:17.5px}
h2{font-size:21px;font-weight:800;margin:0 0 6px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;text-wrap:balance}
h2 .tag{white-space:nowrap;font-size:12.5px;font-weight:800;background:var(--brand-soft);color:var(--accent);border:1px solid var(--brand-line);border-radius:99px;padding:2px 10px}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px clamp(16px,3vw,32px);margin-bottom:20px}
.sec>p.desc{color:var(--sub);margin:0 0 18px;font-size:15.5px;max-width:66ch}
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cc{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:14px;padding:16px 18px}
.cc b{display:block;margin-bottom:6px;color:var(--accent);font-size:16px}
.cc p{margin:0;font-size:15.5px}
.explain{max-width:66ch}
.explain p{margin:0 0 12px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.vs div{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15.5px}
.vs div:last-child{border-color:var(--brand);background:var(--brand-soft)}
.vs b{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px 22px}
.full{grid-column:1/-1}
.f .qrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.f label.q,.f .q{display:block;font-weight:800;font-size:16px;margin-bottom:2px}
.f .hint{display:block;font-size:14px;color:var(--sub);margin:0 0 8px;line-height:1.55}
.clr{border:0;background:none;color:var(--sub);font-size:13px;text-decoration:underline;cursor:pointer;padding:2px 4px;white-space:nowrap}
.clr:hover{color:var(--warn)}
.f input[type=text],.f textarea{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font-size:16.5px;line-height:1.6}
.f textarea{min-height:100px;resize:vertical}
.f textarea.big{min-height:220px}
.f input:focus,.f textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:99px;padding:7px 14px;font-size:15px;cursor:pointer;background:var(--paper);user-select:none;line-height:1.4}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip::before{content:"";width:16px;height:16px;border-radius:5px;border:2px solid var(--line);flex-shrink:0}
.chip.single::before{border-radius:50%}
.chip:has(input:checked){border-color:var(--brand);background:var(--brand-soft);font-weight:800}
.chip:has(input:checked)::before{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 0 0 2.5px var(--paper)}
.chip:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.chip .x{border:0;background:var(--line);color:var(--ink);width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;margin-left:2px}
.chip .x:hover{background:var(--warn);color:#fff}
.chip.custom{border-style:dashed}
.addrow{display:flex;gap:8px;margin-top:10px;max-width:440px;align-items:center}
.addrow input{flex:1;min-width:0;border:1.5px dashed var(--line);background:var(--paper);border-radius:99px;padding:6px 14px;font-size:14.5px;line-height:1.5}
.addrow input:focus{border-color:var(--brand);border-style:solid;outline:none}
.selnote{font-size:13.5px;color:var(--sub);margin-top:6px}
.selnote b{color:var(--accent)}
.colorrow{display:flex;gap:10px;align-items:center}
.colorrow input[type=color]{width:56px;height:44px;border:1.5px solid var(--line);border-radius:12px;padding:2px;background:var(--paper)}
.optsbox{border:1.5px dashed var(--brand-line);background:var(--brand-soft);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.optsbox h3{margin:0 0 4px;font-size:16px;color:var(--accent)}
.optsbox>p{margin:0 0 14px;font-size:14px;color:var(--sub)}
.optsbox .grid2{gap:16px}
.optsbox .chip{background:var(--paper)}
.prompt{background:var(--code);color:var(--code-ink);border-radius:16px;padding:20px 22px;white-space:pre-wrap;font-size:15.5px;line-height:1.85;overflow-x:auto}
.prompt .miss{background:var(--miss-bg);color:var(--miss-ink);border-radius:5px;padding:1px 6px;font-weight:800}
.prompt .fill{color:var(--fill);font-weight:700}
.prompt .optl{color:#9fe0b8}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.pstat{font-size:14.5px;color:var(--sub)}
.pstat.ok{color:var(--ok);font-weight:800}
.pstat.warn{color:var(--warn);font-weight:800}
.btn{border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:10px 18px;font-weight:800;font-size:15.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--paper);color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks label{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:16px}
.checks input{width:20px;height:20px;margin-top:4px;accent-color:var(--ok)}
.checks label:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.checks small{display:block;color:var(--sub);font-size:13.5px}
.score{display:flex;align-items:baseline;gap:10px;margin:14px 0 0;font-size:16px;flex-wrap:wrap}
.score b{font-size:32px;color:var(--accent);font-variant-numeric:tabular-nums}
.complete{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:2px solid var(--line);border-radius:16px;padding:18px 20px;background:var(--paper);margin-bottom:20px}
.complete.on{border-color:var(--ok);background:var(--ok-soft)}
.complete p{margin:0;font-size:15px;color:var(--sub)}
.complete b{display:block;font-size:17px}
.stepedit{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:-6px 0 20px;font-size:14px;color:var(--sub);align-items:center}
.pager{display:flex;justify-content:space-between;gap:10px}
.callout{border-radius:12px;padding:14px 16px;font-size:15.5px;background:var(--warn-soft);margin-top:14px}
.callout b{color:var(--warn)}
.steps-list{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.steps-list li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;font-size:16px}
.steps-list li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:13.5px;font-weight:800;margin-top:2px}
.preview{border:2px dashed var(--brand);border-radius:14px;padding:14px 16px;background:var(--brand-soft);font-weight:800;margin-top:16px;font-size:17px}
.preview small{display:block;font-weight:500;color:var(--sub);font-size:13px}
details{border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:8px;background:var(--paper)}
details summary{cursor:pointer;font-weight:800;font-size:16px}
details p{margin:8px 0 0;font-size:15.5px}
table.routine{width:100%;border-collapse:collapse;font-size:15.5px}
table.routine th,table.routine td{border-bottom:1px solid var(--line);padding:10px 6px;text-align:left;vertical-align:middle}
table.routine th{color:var(--sub);font-weight:800;font-size:13.5px}
table.routine input,table.routine select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);font-size:15.5px}
.tw{overflow-x:auto}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.summary button{border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14px;text-align:left;background:var(--paper);cursor:pointer}
.summary button.on{border-color:var(--ok);background:var(--ok-soft)}
.summary b{display:block;font-size:15.5px}
.savebox{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.savebox .card{border:1.5px solid var(--line);border-radius:16px;padding:18px}
.savebox h3{margin:0 0 6px;font-size:17px}
.savebox p{margin:0 0 12px;font-size:15px;color:var(--sub)}
.confirm{border:2px solid var(--warn);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--warn-soft);font-size:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:99px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
#report{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#1f1d17;font-family:var(--body)}
#report .rs{padding:26px 40px;font-size:13px;line-height:1.7}
#report h2{font-size:18px;color:#8a5a00;margin:0 0 10px;border-bottom:3px solid #e3a008;padding-bottom:6px}
#report h4{font-size:13px;margin:10px 0 2px;color:#8a5a00}
#report .rv{white-space:pre-wrap;margin:0}
#report pre{white-space:pre-wrap;background:#fff6dc;border-radius:8px;padding:10px 12px;font-family:var(--body);font-size:12px;margin:4px 0}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;height:auto;border-right:0;border-bottom:1px solid var(--line);z-index:5;padding:12px 16px;gap:8px}
  .logo small,.side-foot{display:none}
  nav ol{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav button{grid-template-columns:26px auto;white-space:nowrap;padding:6px 10px}
  nav .no{width:26px;height:26px}
  nav .t small{display:none}
  .grid2,.vs{grid-template-columns:1fr}
  .top{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><span class="dot"></span>1인 대표 SNS 마케팅<br>실습 워크북<small>AI 활용 올인원 실전 SNS마케팅 · 4시간 과정</small></div>
    <div class="prog"><div class="bar"><i id="progBar"></i></div><span id="progText">0 / 8 단계 완료</span></div>
    <nav aria-label="실습 단계"><ol id="nav"></ol></nav>
    <div class="side-foot">입력한 내용은 이 브라우저에 자동 저장됩니다. 언제든 앞 단계로 돌아가 고칠 수 있고, 잘못 바꿨다면 위쪽 [되돌리기]를 누르세요.</div>
  </aside>
  <main id="main"></main>
</div>
<div id="report" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="loadFile" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ================================================================ state
   S.f : 답변 (글자 또는 선택 배열)   S.x : 직접 추가한 선택지   S.c : 체크   S.done : 단계 완료 */
const KEY='sns-workbook-1in-v2';
let S={f:{},x:{},c:{},done:{}};
try{ const raw=localStorage.getItem(KEY)||localStorage.getItem('sns-workbook-1in-v1'); if(raw){ const d=JSON.parse(raw); S={f:d.f||{},x:d.x||{},c:d.c||{},done:d.done||{}}; } }catch(e){}
/* 되돌리기 / 다시 실행 */
let UNDO=[], REDO=[], lastSnap=0;
function snap(force){ const now=Date.now(); if(force||now-lastSnap>900){ UNDO.push(JSON.stringify(S)); if(UNDO.length>80) UNDO.shift(); REDO=[]; } lastSnap=now; }
function undo(){ if(!UNDO.length){ toast('더 되돌릴 내용이 없습니다'); return; } REDO.push(JSON.stringify(S)); S=JSON.parse(UNDO.pop()); lastSnap=0; persist(); render(false); toast('직전 수정을 되돌렸습니다'); }
function redo(){ if(!REDO.length){ toast('다시 실행할 내용이 없습니다'); return; } UNDO.push(JSON.stringify(S)); S=JSON.parse(REDO.pop()); lastSnap=0; persist(); render(false); toast('다시 실행했습니다'); }
let saveTimer;
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(KEY,JSON.stringify(S)); setSaved('자동 저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})); }
    catch(e){ setSaved('자동 저장이 꺼진 브라우저입니다. 저장 단계에서 백업을 꼭 받으세요.'); }
  },300);
  updateHistoryBtns();
}
function setSaved(t){ const el=document.getElementById('savedNote'); if(el) el.textContent=t; }
function updateHistoryBtns(){ const u=document.getElementById('undoBtn'), r=document.getElementById('redoBtn'); if(u) u.disabled=!UNDO.length; if(r) r.disabled=!REDO.length; }
const val=id=>{ const v=S.f[id]; return Array.isArray(v)?v.join(', '):(v||'').toString().trim(); };
const arr=id=>Array.isArray(S.f[id])?S.f[id]:(S.f[id]?[S.f[id]]:[]);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }

/* ============================================================ field kit
   chips: 중복 선택 + 직접 추가가 기본. single:true 이면 하나만 선택 */
const F={
  text:(id,q,hint='',ph='',full=false)=>({t:'text',id,q,hint,ph,full}),
  area:(id,q,hint='',ph='',full=true,big=false)=>({t:'area',id,q,hint,ph,full,big}),
  chips:(id,q,opts,hint='',o={})=>({t:'chips',id,q,opts,hint,full:o.full!==false,single:!!o.single,custom:o.custom!==false,ph:o.ph||'직접 입력'}),
  color:(id,q,hint='')=>({t:'color',id,q,hint}),

/* =============================================================== prompts
   P`...${'id'}...` : 값이 있으면 채우고, 없으면 빨간 칸. ${'?id'} 는 비어도 생략 */
function P(strings,...ids){
  let html='',text='',miss=0;
  strings.forEach((s,i)=>{
    html+=esc(s); text+=s;
    if(i<ids.length){
      const opt=ids[i].startsWith('?'), id=opt?ids[i].slice(1):ids[i], v=val(id);
      if(opt&&!v){}
      else if(v){ html+='<span class="fill">'+esc(v)+'</span>'; text+=v; }
      else{ miss++; const lab='〔'+(SHORT[id]||LABEL[id]||id)+'〕'; html+='<span class="miss">'+esc(lab)+'</span>'; text+=lab; }
    }
  });
  return {html,text,miss};
}
/* 요청 옵션 줄 덧붙이기: [[라벨, id], ...] → 선택된 것만 "- 라벨: 값" */
function withOpts(r,list,head='[추가 요청]'){
  const lines=list.map(([lab,id])=>val(id)?`- ${lab}: ${val(id)}`:'').filter(Boolean);
  if(!lines.length) return r;
  const t='\n\n'+head+'\n'+lines.join('\n');
  return {html:r.html+'<span class="optl">'+esc(t)+'</span>',text:r.text+t,miss:r.miss};
}

/* ============================================================ rendering */
const main=document.getElementById('main'), nav=document.getElementById('nav');
let cur=0;

function clearBtn(id){ return `<button type="button" class="clr" data-clear="${id}" aria-label="${esc(LABEL[id]||id)} 지우기">지우기</button>`; }
function fieldHTML(f){
  const v=S.f[f.id];
  const hint=f.hint?`<span class="hint">${f.hint}</span>`:'';
  if(f.t==='chips'){
    const sel=arr(f.id), custom=S.x[f.id]||[];
    const base=f.opts.map((o,i)=>`<label class="chip ${f.single?'single':''}"><input type="checkbox" id="${f.id}_${i}" data-chip="${f.id}" value="${esc(o)}" ${sel.includes(o)?'checked':''}>${esc(o)}</label>`).join('');
    const cus=custom.map((o,i)=>`<label class="chip custom ${f.single?'single':''}"><input type="checkbox" id="${f.id}_c${i}" data-chip="${f.id}" value="${esc(o)}" ${sel.includes(o)?'checked':''}>${esc(o)}<button type="button" class="x" data-delchip="${f.id}" data-v="${esc(o)}" aria-label="${esc(o)} 선택지 삭제">✕</button></label>`).join('');
    const add=f.custom?`<div class="addrow"><input type="text" id="${f.id}_add" data-addfor="${f.id}" placeholder="${esc(f.ph)} 후 Enter" aria-label="${esc(f.q)} 직접 입력"><button type="button" class="btn ghost small" data-addbtn="${f.id}">추가</button></div>`:'';
    const note=`<div class="selnote" id="${f.id}_note">${sel.length?`선택 <b>${sel.length}</b>개 · ${esc(sel.join(', '))}`:(f.single?'하나만 고릅니다':'여러 개 고를 수 있습니다')}</div>`;
    return `<div class="f ${f.full?'full':''}"><div class="qrow"><span class="q" id="${f.id}_lab">${f.q}</span>${sel.length?clearBtn(f.id):''}</div>${hint}<div class="chips" role="group" aria-labelledby="${f.id}_lab">${base}${cus}</div>${add}${note}</div>`;
  }
  let inner='';
  if(f.t==='text') inner=`<input type="text" id="${f.id}" data-f="${f.id}" placeholder="${esc(f.ph||'')}" value="${esc(v||'')}">`;
  if(f.t==='area') inner=`<textarea id="${f.id}" data-f="${f.id}" class="${f.big?'big':''}" placeholder="${esc(f.ph||'')}">${esc(v||'')}</textarea>`;
  if(f.t==='color') inner=`<div class="colorrow"><input type="color" id="${f.id}" data-f="${f.id}" value="${esc(v||'#e3a008')}"><span class="hint" style="margin:0">${esc(v||'선택 안 함')}</span></div>`;
  return `<div class="f ${f.full?'full':''}"><div class="qrow"><label class="q" for="${f.id}">${f.q}</label>${v?clearBtn(f.id):''}</div>${hint}${inner}</div>`;
}
function blockHTML(b){
  if(b.kind==='concept') return `<section class="sec"><h2>${b.title}${b.tag?`<span class="tag">${b.tag}</span>`:''}</h2>${b.html.replace('{상호}',esc(val('b_name')||'상호'))}</section>`;
  if(b.kind==='fields') return `<section class="sec"><h2>${b.title}<span class="tag">내 사업에 적용</span></h2>${b.desc?`<p class="desc">${b.desc}</p>`:''}
    ${b.action?`<div class="btns" style="margin-bottom:18px"><button class="btn small" data-act="${b.action.fn}">${b.action.label}</button></div>`:''}
    <div class="grid2">${b.fields.map(fieldHTML).join('')}</div>${b.preview?`<div class="preview" id="${b.preview}"></div>`:''}</section>`;
  if(b.kind==='opts') return `<div class="optsbox"><h3>${b.title}</h3><p>원하는 것을 여러 개 골라 AI에게 더 자세히 요청하세요. 고르지 않으면 기본으로 만듭니다. 고른 내용은 프롬프트 맨 아래 초록색 줄로 추가됩니다.</p><div class="grid2">${b.fields.map(fieldHTML).join('')}</div></div>`;
  if(b.kind==='prompt'){
    const pre=STEPS[cur].blocks.find(x=>x.kind==='opts'&&x.key===b.key);
    return `<section class="sec"><h2>${b.title}<span class="tag">자동 완성</span></h2><p class="desc">${b.desc}</p>${pre?'':''}
    <div class="prompt" id="p_${b.key}" aria-live="polite"></div>
    <div class="pbar"><span class="pstat" id="ps_${b.key}"></span><div class="btns"><button class="btn" data-copy="${b.key}">프롬프트 복사</button>
    <a class="btn ghost" href="https://gemini.google.com/app" target="_blank" rel="noopener">Gemini 열기</a><a class="btn ghost" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT 열기</a></div></div></section>`;
  }
  if(b.kind==='checks') return `<section class="sec"><h2>${b.title}<span class="tag">체크</span></h2><ul class="checks">${b.items.map(([id,t,s])=>`<li><label><input type="checkbox" id="${id}" data-c="${id}" ${S.c[id]?'checked':''}><span>${t}${s?`<small>${s}</small>`:''}</span></label></li>`).join('')}</ul>
    ${b.score?`<div class="score">자가진단 점수 <b id="scoreNum">0</b>/ 20점 <span id="scoreMsg" class="pstat"></span></div>`:''}</section>`;
  if(b.kind==='routine') return `<section class="sec"><h2>${b.title}<span class="tag">내 계획</span></h2><p class="desc">${b.desc}</p><div class="tw"><table class="routine"><thead><tr><th style="width:60px">요일</th><th>할 일</th><th style="width:120px">시간</th></tr></thead><tbody>
    ${ROUTINE.map(([d,task,min],i)=>{ const curT=S.f['rt_'+i]??task; const opts=[...TASKS,...(S.x.rt||[])]; if(!opts.includes(curT)) opts.push(curT);
      return `<tr><td><b>${d}</b></td><td><select id="rt_${i}" data-f="rt_${i}" aria-label="${d}요일 할 일">${opts.map(t=>`<option ${curT===t?'selected':''}>${esc(t)}</option>`).join('')}</select></td><td><input type="text" id="rm_${i}" data-f="rm_${i}" aria-label="${d}요일 시간" value="${esc(S.f['rm_'+i]??min)}"></td></tr>`;}).join('')}
    </tbody></table></div>
    <div class="addrow"><input type="text" id="rt_add" placeholder="목록에 없는 할 일 직접 추가" aria-label="루틴 할 일 직접 추가"><button type="button" class="btn ghost small" data-act="addTask">추가</button></div>
    <p class="pstat" style="margin:12px 0 0" id="routineSum"></p></section>`;
  if(b.kind==='save') return saveHTML();
  return '';
}

const ROUTINE=[['월',TASKS[0],'10분'],['화',TASKS[1],'30분'],['수',TASKS[2],'20분'],['목',TASKS[3],'10분'],['금',TASKS[4],'20분'],['토',TASKS[5],'10분'],['일',TASKS[8],'-']];

  const cards=STEPS.slice(0,-1).map((s,i)=>`<button data-go="${i}" class="${S.done[s.id]?'on':''}"><b>${s.no}. ${s.nav}</b>${S.done[s.id]?'완료 ✓ · 눌러서 수정':'진행 중 · 눌러서 이어 쓰기'}</button>`).join('');
  return `<section class="sec"><h2>진행 현황</h2><p class="desc">카드를 누르면 그 단계로 이동해 내용을 고칠 수 있습니다.</p><div class="summary">${cards}</div></section>

    <button class="btn ghost small" data-act="saveCSV">CSV 파일 저장</button></div>
   <div class="card"><h3>② PDF</h3><p>모든 답변과 완성된 프롬프트를 A4 문서로 만듭니다. 휴대폰에서는 조금 걸릴 수 있습니다.</p>
    <button class="btn" data-act="savePDF">PDF 만들기</button></div>
   <div class="card"><h3>③ 백업 파일 (이어서 하기)</h3><p>다른 컴퓨터나 다음 수업에서 이어 쓰려면 백업을 저장하고 나중에 불러옵니다.</p>
    <div class="btns"><button class="btn ghost small" data-act="saveJSON">백업 저장</button><button class="btn ghost small" data-act="loadJSON">백업 불러오기</button></div>
    <p style="margin-top:14px;font-size:14px">처음부터 완전히 새로 쓰려면 <button class="clr" data-act="resetAsk">전체 초기화</button></p><div id="resetBox"></div></div>

function render(scrollTop=true){
  const s=STEPS[cur];
  nav.innerHTML=STEPS.map((x,i)=>`<li><button data-go="${i}" class="${S.done[x.id]?'done':''}" ${i===cur?'aria-current="page"':''}><span class="no">${S.done[x.id]?'✓':x.no}</span><span class="t">${x.nav}<small>${x.navsub}</small></span></button></li>`).join('');
  main.innerHTML=`<div class="top"><span class="eyebrow">STEP ${s.no} · ${s.time}</span><div class="history"><span class="saved" id="savedNote"></span><button class="btn ghost small" id="undoBtn" data-act="undo" title="Ctrl+Z">↶ 되돌리기</button><button class="btn ghost small" id="redoBtn" data-act="redo" title="Ctrl+Y">↷ 다시 실행</button></div></div>
    <h1>${s.title}</h1><p class="lead">${s.lead}</p>
    ${s.blocks.map(blockHTML).join('')}
    ${s.id!=='save'?`<div class="complete" id="completeBox"><div><b id="cTitle"></b><p id="cDesc"></p></div><button class="btn" id="doneBtn"></button></div>
    <div class="stepedit"><span>이 단계만 다시 쓰고 싶다면</span><button class="btn danger small" data-act="clearStepAsk">이 단계 입력만 비우기</button></div><div id="clearStepBox"></div>`:''}
    <div class="pager"><button class="btn ghost" data-go="${cur-1}" ${cur===0?'disabled':''}>← 이전 단계</button>${cur<STEPS.length-1?`<button class="btn" data-go="${cur+1}">다음 단계 →</button>`:''}</div>`;
  refresh(); updateProgress(); updateHistoryBtns();
  const cb=nav.querySelector('[aria-current]'); if(cb) try{ cb.scrollIntoView({block:'nearest',inline:'center'}); }catch(e){}
  if(scrollTop) window.scrollTo({top:0});
  try{ if(location.hash.slice(1)!==s.id) history.replaceState(null,'','#'+s.id); }catch(e){}
}
function stepChecks(s){ return s.blocks.filter(b=>b.kind==='checks').flatMap(b=>b.items.map(i=>i[0])); }
function stepFieldIds(s){ return s.blocks.filter(b=>b.kind==='fields'||b.kind==='opts').flatMap(b=>b.fields.map(f=>f.id)).concat(s.blocks.some(b=>b.kind==='routine')?[0,1,2,3,4,5,6].flatMap(i=>['rt_'+i,'rm_'+i]):[]); }
function refresh(){
  const s=STEPS[cur];
  s.blocks.filter(b=>b.kind==='prompt').forEach(b=>{
    const r=PROMPTS[b.key](); const el=document.getElementById('p_'+b.key); if(!el) return;
    el.innerHTML=r.html;
    const st=document.getElementById('ps_'+b.key);
    st.className='pstat '+(r.miss?'warn':'ok');
    st.textContent=r.miss?`빨간 칸 ${r.miss}개가 비어 있습니다. 앞의 양식을 채우면 자동으로 들어갑니다.`:'모든 칸이 채워졌습니다. 복사해서 사용하세요.';
  });
  const tp=document.getElementById('titlePreview');
  if(tp){ const a=[val('s_t_who'),val('s_t_prod')].filter(Boolean).join(' '); const b=[val('s_t_pain'),val('s_t_info')].filter(Boolean).join(', ');
    tp.innerHTML=`<small>완성 제목 미리보기</small>${esc(a||'누구 무엇')} | ${esc(b||'고민, 알려 줄 정보')}${val('s_t_info')?' 확인하세요':''}`; }
  const sn=document.getElementById('scoreNum');
  if(sn){ const n=['sc1','sc2','sc3','sc4','sc5','sc6','sc7','sc8','sc9','sc10'].filter(k=>S.c[k]).length*2; sn.textContent=n;
    document.getElementById('scoreMsg').textContent=n>=16?'바로 다음 단계로':n>=12?'부족한 항목을 표시해 두세요':'집에서 세팅부터 다시 점검'; }
  const rs=document.getElementById('routineSum');
  if(rs){ let tot=0; for(let i=0;i<7;i++){ const m=String(S.f['rm_'+i]??ROUTINE[i][2]).match(/\d+/); if(m) tot+=+m[0]; } rs.textContent=`한 주 합계 약 ${tot}분 · 처음 한 달은 실제 걸린 시간을 적어 보고 조정하세요.`; }
  const box=document.getElementById('completeBox'); if(!box) return;
  const ids=stepChecks(s); const got=ids.filter(k=>S.c[k]).length; const all=got===ids.length; const done=!!S.done[s.id];
  box.classList.toggle('on',done);
  document.getElementById('cTitle').textContent=done?'이 단계를 완료했습니다 ✓':`완료 체크 ${got} / ${ids.length}`;
  document.getElementById('cDesc').textContent=done?'완료한 뒤에도 위 내용을 언제든 고칠 수 있습니다. 고친 내용은 바로 저장됩니다.':(s.id==='setup'?'자가진단은 해당하는 만큼만 체크하면 됩니다. 모두 체크하지 않아도 완료할 수 있습니다.':'체크리스트를 모두 확인하면 완료할 수 있습니다.');
  const btn=document.getElementById('doneBtn');
  btn.textContent=done?'완료 표시 취소':'이 단계 완료';
  btn.disabled=!done&&!(all||s.id==='setup'||ids.length===0);
}
function updateProgress(){
  const total=STEPS.length-1, n=STEPS.slice(0,-1).filter(s=>S.done[s.id]).length;
  document.getElementById('progBar').style.width=(n/total*100)+'%';
  document.getElementById('progText').textContent=`${n} / ${total} 단계 완료`;
}
function findField(id){ for(const s of STEPS) for(const b of s.blocks) if(b.fields) for(const f of b.fields) if(f.id===id) return f; return null; }
function redrawField(id){
  const f=findField(id); if(!f) return; const el=document.getElementById(f.t==='chips'?id+'_lab':id); if(!el) return;
  const wrap=el.closest('.f'); const tmp=document.createElement('div'); tmp.innerHTML=fieldHTML(f); wrap.replaceWith(tmp.firstElementChild);
}

/* =============================================================== events */
function onEdit(e){
  const t=e.target;
  if(t.dataset.f){ snap(t.tagName==='SELECT'||t.type==='color'); S.f[t.dataset.f]=t.value; if(t.type==='color') t.nextElementSibling.textContent=t.value;
    if(e.type==='change' && (t.tagName!=='SELECT')) redrawField(t.dataset.f); }
  else if(t.dataset.chip){
    if(e.type!=='change') return;
    snap(true); const id=t.dataset.chip, f=findField(id);
    if(f&&f.single){ S.f[id]=t.checked?[t.value]:[]; }
    else{ const set=new Set(arr(id)); t.checked?set.add(t.value):set.delete(t.value); S.f[id]=[...set]; }
    redrawField(id); const again=document.getElementById(t.id); if(again) again.focus();
  }
  else if(t.dataset.c){ if(e.type!=='change') return; snap(true); S.c[t.dataset.c]=t.checked; }
  else return;
  persist(); refresh();
}
main.addEventListener('input',onEdit);
main.addEventListener('change',onEdit);
main.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset.addfor){ e.preventDefault(); addChip(e.target.dataset.addfor); }
  if(e.key==='Enter'&&e.target.id==='rt_add'){ e.preventDefault(); ACTIONS.addTask(); }
});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.type!=='checkbox';
  if((e.ctrlKey||e.metaKey)&&!typing){ if(e.key==='z'&&!e.shiftKey){ e.preventDefault(); undo(); } if(e.key==='y'||(e.key==='z'&&e.shiftKey)){ e.preventDefault(); redo(); } }
});
function addChip(id){
  const inp=document.getElementById(id+'_add'); const v=(inp.value||'').trim(); if(!v){ inp.focus(); return; }
  const f=findField(id); snap(true);
  const list=S.x[id]||[]; if(!f.opts.includes(v)&&!list.includes(v)) list.push(v); S.x[id]=list;
  if(f.single) S.f[id]=[v]; else { const set=new Set(arr(id)); set.add(v); S.f[id]=[...set]; }
  persist(); redrawField(id); refresh(); const ni=document.getElementById(id+'_add'); if(ni) ni.focus(); toast(`"${v}"을(를) 추가하고 선택했습니다`);
}
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]'); if(g&&!g.disabled){ go(+g.dataset.go); return; }
  const c=e.target.closest('[data-copy]'); if(c){ await copyText(PROMPTS[c.dataset.copy]().text,'프롬프트를 복사했습니다'); return; }
  const ab=e.target.closest('[data-addbtn]'); if(ab){ addChip(ab.dataset.addbtn); return; }
  const dc=e.target.closest('[data-delchip]'); if(dc){ e.preventDefault(); e.stopPropagation(); const id=dc.dataset.delchip, v=dc.dataset.v; snap(true);
    S.x[id]=(S.x[id]||[]).filter(x=>x!==v); S.f[id]=arr(id).filter(x=>x!==v); persist(); redrawField(id); refresh(); toast(`"${v}" 선택지를 지웠습니다 · 되돌리기 가능`); return; }
  const cl=e.target.closest('[data-clear]'); if(cl){ const id=cl.dataset.clear; snap(true); delete S.f[id]; persist(); redrawField(id); refresh(); toast('이 칸을 비웠습니다 · 되돌리기 가능'); return; }
  const a=e.target.closest('[data-act]'); if(a){ ACTIONS[a.dataset.act]&&ACTIONS[a.dataset.act](a); return; }
  if(e.target.id==='doneBtn'){ const s=STEPS[cur]; snap(true); S.done[s.id]=!S.done[s.id]; persist(); refresh(); updateProgress();
    const nb=nav.querySelectorAll('button')[cur]; nb.classList.toggle('done',!!S.done[s.id]); nb.querySelector('.no').textContent=S.done[s.id]?'✓':s.no;
    if(S.done[s.id]) toast('완료했습니다. 다음 단계로 넘어가세요'); }
});
function go(i){ if(i<0||i>=STEPS.length) return; cur=i; render(); }
window.addEventListener('hashchange',()=>{ const i=STEPS.findIndex(s=>s.id===location.hash.slice(1)); if(i>=0&&i!==cur){ cur=i; render(); } });
async function copyText(text,msg){
  try{ await navigator.clipboard.writeText(text); toast(msg); }
  catch(err){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); toast(ok?msg:'복사가 막혀 있습니다. 상자 안 글자를 길게 눌러 직접 복사하세요'); }
}

/* ============================================================== actions */
const ACTIONS={
 undo, redo,
 suggestSetup(){
  snap(true);
  const n=val('b_name'), area=(val('b_area').split(/[\/,·]/)[0]||'').trim(), p=[val('b_p1'),val('b_p2')].filter(Boolean).join('·');
  let filled=0; const set=(id,v)=>{ if(!v||val(id)) return; S.f[id]=v; filled++; };
  set('s_blogname',[area&&p?`${area} ${p}`:(area||p),n].filter(Boolean).join(' | '));
  set('s_intro',[[area,val('b_kind')].filter(Boolean).join(' '),products(),val('d_s1'),val('b_contact')?'문의는 '+arr('b_contact')[0]+'으로':''].filter(Boolean).join('. ')+'.');
  if(!arr('s_cats').length){ S.f.s_cats=['상품 안내','주문·예약 방법','이용 팁','가게 소식']; filled++; }
  set('s_igname',[n,(val('b_kind').replace(/1인\s*/,'').split(/[(\s]/)[0]||''),area].filter(Boolean).join(' · '));
  set('s_igbio',[products(),who()?who()+'를 위한 곳':'',[area,val('d_s1')].filter(Boolean).join(' · '),arr('b_contact').length?'문의·예약은 아래 링크 ('+arr('b_contact')[0]+')':''].filter(Boolean).join('\n'));
  if(!arr('s_hl').length){ S.f.s_hl=['상품 안내','가격·예약','오시는 길','고객 후기']; filled++; }
  set('s_t_who',val('c_who').split(/[,·]/)[0]||[arr('c_age')[0],arr('c_role')[0]].filter(Boolean).join(' ')); set('s_t_prod',val('b_p1'));
  persist(); render(false); toast(filled?`빈 칸 ${filled}개를 채웠습니다. 내 말로 다듬어 주세요`:'이미 모두 채워져 있어 바꾸지 않았습니다');
 },
 suggestTags(){
  snap(true);
  const tag=s=>s?('#'+s.replace(/[\s·,()\/]+/g,'')):''; const area=(val('b_area').split(/[\/,·\s]/).find(x=>x)||'');
  const kind=(val('b_kind').replace(/1인\s*/,'').split(/[(\s]/)[0]||'');
  let filled=0; const set=(id,v)=>{ if(!v||val(id)) return; S.f[id]=v; filled++; };
  set('i_tag1',[val('b_p1'),val('b_p2'),val('b_p3')].filter(Boolean).map(tag).join(' '));
  set('i_tag2',[...arr('c_when').slice(0,1),...arr('c_role').slice(0,1)].map(tag).join(' '));
  set('i_tag3',tag(val('b_name')));
  set('i_tag4',area&&kind?`${tag(area+kind)} ${tag(area)}`:tag(area));
  persist(); render(false); toast(filled?'빈 칸에 태그 후보를 채웠습니다':'이미 채워져 있어 바꾸지 않았습니다');
 },
 addTask(){ const inp=document.getElementById('rt_add'); const v=(inp.value||'').trim(); if(!v) return; snap(true); S.x.rt=[...new Set([...(S.x.rt||[]),v])]; persist(); render(false); toast(`"${v}"을(를) 할 일 목록에 추가했습니다`); },
 clearStepAsk(){ document.getElementById('clearStepBox').innerHTML=`<div class="confirm"><b>이 단계에 쓴 내용과 체크만 비웁니다.</b> 다른 단계는 그대로입니다. 실수했다면 위쪽 [되돌리기]로 바로 복구할 수 있습니다.<div class="btns" style="margin-top:10px"><button class="btn danger small" data-act="clearStepYes">이 단계 비우기</button><button class="btn ghost small" data-act="clearStepNo">취소</button></div></div>`; },
 clearStepNo(){ document.getElementById('clearStepBox').innerHTML=''; },
 clearStepYes(){ const s=STEPS[cur]; snap(true); stepFieldIds(s).forEach(id=>{ delete S.f[id]; }); stepChecks(s).forEach(k=>delete S.c[k]); delete S.done[s.id]; lastSnap=0; persist(); render(false); toast('이 단계를 비웠습니다 · [되돌리기]로 복구할 수 있습니다'); },
 async copySheet(){ await copyText(rowsTSV(),'시트용으로 복사했습니다. 새 시트의 A1 칸에 붙여넣으세요'); },
 async saveCSV(){ const csv='﻿'+toRows().map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'); await offerFile(fileBase()+'.csv',new Blob([csv],{type:'text/csv'})); },
 async saveJSON(){ await offerFile(fileBase()+'_백업.json',JSON.stringify(S,null,2)); },
 loadJSON(){ document.getElementById('loadFile').click(); },
 resetAsk(){ document.getElementById('resetBox').innerHTML='<div class="confirm"><b>모든 단계의 내용이 지워집니다.</b> 일부만 고치려면 해당 칸을 수정하거나 단계별 [이 단계 입력만 비우기]를 쓰세요.<div class="btns" style="margin-top:10px"><button class="btn danger small" data-act="resetYes">전체 초기화</button><button class="btn ghost small" data-act="resetNo">취소</button></div></div>'; },
 resetNo(){ document.getElementById('resetBox').innerHTML=''; },
 resetYes(){ snap(true); S={f:{},x:{},c:{},done:{}}; lastSnap=0; persist(); cur=0; render(); toast('초기화했습니다 · [되돌리기]로 복구할 수 있습니다'); },
 async savePDF(btn){
  if(!window.html2canvas||!window.jspdf){ toast('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요'); return; }
  btn.disabled=true; btn.textContent='PDF 만드는 중…';
  try{
    const rep=document.getElementById('report'); rep.innerHTML=reportHTML();
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'pt',format:'a4'});
    const W=pdf.internal.pageSize.getWidth(), H=pdf.internal.pageSize.getHeight(), M=24; let y=M, first=true;
    for(const sec of rep.querySelectorAll('.rs')){
      const cv=await html2canvas(sec,{scale:2,backgroundColor:'#ffffff'});
      const w=W-M*2, h=cv.height*w/cv.width;
      if(h<=H-M*2){ if(!first&&y+h>H-M){ pdf.addPage(); y=M; } pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',M,y,w,h); y+=h+8; }
      else{
        if(!first){ pdf.addPage(); y=M; }
        const pagePx=Math.floor((H-M*2)*cv.width/w); let off=0;
        while(off<cv.height){ const sh=Math.min(pagePx,cv.height-off); const c2=document.createElement('canvas'); c2.width=cv.width; c2.height=sh;
          c2.getContext('2d').drawImage(cv,0,off,cv.width,sh,0,0,cv.width,sh);
          pdf.addImage(c2.toDataURL('image/jpeg',0.92),'JPEG',M,M,w,sh*w/cv.width); off+=sh;
          if(off<cv.height) pdf.addPage(); else y=M+sh*w/cv.width+8; }
      }
      first=false;
    }
    rep.innerHTML='';
    await offerFile(fileBase()+'.pdf',pdf.output('blob'));
  }catch(err){ toast('PDF를 만들지 못했습니다. 잠시 후 다시 눌러 주세요'); }
  btn.disabled=false; btn.textContent='PDF 만들기';
 },
};
document.getElementById('loadFile').addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file) return;
  try{ const d=JSON.parse(await file.text()); snap(true); S={f:d.f||{},x:d.x||{},c:d.c||{},done:d.done||{}}; lastSnap=0; persist(); render(); toast('백업을 불러왔습니다'); }
  catch(err){ toast('백업 파일을 읽지 못했습니다. 이 워크북에서 저장한 .json 파일인지 확인하세요'); }
  e.target.value='';
});

/* ======================================================= export helpers */
const fileBase=()=>`SNS실습_${(val('b_name')||'내가게').replace(/[\\/:*?"<>|\s]+/g,'')}_${new Date().toISOString().slice(0,10)}`;
let downloadsNS=null;
(async()=>{ try{ if(window.claude&&window.claude.use) downloadsNS=await window.claude.use('downloads'); }catch(e){} })();
async function offerFile(name,data){
  if(downloadsNS){ try{ await downloadsNS.save({filename:name,data}); toast('저장했습니다'); return; }
    catch(err){ if(err&&err.code==='declined'){ toast('저장을 취소했습니다'); return; } } }
  try{ const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); toast('저장을 시작했습니다'); }
  catch(err){ toast('이 화면에서는 파일 저장이 막혀 있습니다. [시트용으로 복사]를 이용하세요'); }
}
function allFields(step){ return step.blocks.filter(b=>b.kind==='fields'||b.kind==='opts').flatMap(b=>b.fields); }
function toRows(){
  const rows=[['단계','항목','내용']];
  rows.push(['정보','이름',val('me_name')],['정보','저장일',new Date().toLocaleString('ko-KR')]);
  STEPS.slice(0,-1).forEach(s=>{
    const st=`${s.no}. ${s.nav}`;
    rows.push([st,'완료 여부',S.done[s.id]?'완료':'진행 중']);
    allFields(s).forEach(f=>{ const v=val(f.id); if(v) rows.push([st,f.q,v]); });
    s.blocks.filter(b=>b.kind==='routine').forEach(()=>ROUTINE.forEach(([d,t,m],i)=>rows.push([st,`주간 루틴 · ${d}`,`${S.f['rt_'+i]??t} (${S.f['rm_'+i]??m})`])));
    s.blocks.filter(b=>b.kind==='prompt').forEach(b=>rows.push([st,'[프롬프트] '+b.title,PROMPTS[b.key]().text]));
    stepChecks(s).forEach(k=>rows.push([st,'[체크] '+(LABEL[k]||k),S.c[k]?'✓':'']));
  });
  return rows;
}
function rowsTSV(){ return toRows().map(r=>r.map(c=>{ c=String(c).replace(/\t/g,' '); return /[\n"]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join('\t')).join('\n'); }
function reportHTML(){
  let h=`<div class="rs"><h2>1인 대표 SNS 마케팅 실습 결과</h2><p class="rv"><b>${esc(val('b_name'))}</b> · ${esc(val('me_name'))} · ${new Date().toLocaleDateString('ko-KR')}</p><p class="rv">${esc(val('r_one'))}</p></div>`;
  STEPS.slice(1,-1).forEach(s=>{
    let body=''; allFields(s).forEach(f=>{ const v=val(f.id); if(v) body+=`<h4>${esc(f.q)}</h4><p class="rv">${esc(v)}</p>`; });
    s.blocks.filter(b=>b.kind==='routine').forEach(()=>{ body+='<h4>주간 루틴</h4><p class="rv">'+ROUTINE.map(([d,t,m],i)=>`${d} · ${esc(S.f['rt_'+i]??t)} (${esc(S.f['rm_'+i]??m)})`).join('\n')+'</p>'; });
    const ck=stepChecks(s); if(ck.length) body+=`<h4>체크 결과 (${ck.filter(k=>S.c[k]).length}/${ck.length})</h4><p class="rv">${ck.map(k=>(S.c[k]?'☑ ':'☐ ')+esc(LABEL[k]||k)).join('\n')}</p>`;
    h+=`<div class="rs"><h2>${s.no}. ${esc(s.title)} ${S.done[s.id]?'· 완료':''}</h2>${body||'<p class="rv">작성한 내용이 없습니다.</p>'}</div>`;
    s.blocks.filter(b=>b.kind==='prompt').forEach(b=>{ h+=`<div class="rs"><h4>[프롬프트] ${esc(b.title)}</h4><pre>${esc(PROMPTS[b.key]().text)}</pre></div>`; });
  });
  return h;
}

/* ================================================================ start */
STEPS.forEach(s=>s.blocks.forEach(b=>{ if(b.fields) b.fields.forEach(f=>LABEL[f.id]=f.q); if(b.kind==='checks') b.items.forEach(i=>LABEL[i[0]]=i[1]); }));
// 이전 버전(단일 선택) 데이터를 배열로 맞추기
STEPS.forEach(s=>s.blocks.forEach(b=>{ if(b.fields) b.fields.forEach(f=>{ if(f.t==='chips'&&S.f[f.id]&&!Array.isArray(S.f[f.id])) S.f[f.id]=String(S.f[f.id]).split(/,\s*/).filter(Boolean); }); }));
// 이전 선택값 중 목록에 없는 것은 직접 추가 선택지로 보존
STEPS.forEach(s=>s.blocks.forEach(b=>{ if(b.fields) b.fields.forEach(f=>{ if(f.t==='chips') arr(f.id).forEach(v=>{ if(!f.opts.includes(v)){ S.x[f.id]=[...new Set([...(S.x[f.id]||[]),v])]; } }); }); }));
{ const i=STEPS.findIndex(s=>s.id===location.hash.slice(1)); if(i>=0) cur=i; }
render();
</script>
